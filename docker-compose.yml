# Full stack: docker compose up --build
#
# Three services: the database, the Java backend (which also serves the web
# control panel), and the Python voice server that carries call audio.
#
# Ports are published on 127.0.0.1 only — the panel has no login and is not
# meant to be reachable from the network.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-PLACEHOLDER_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent}"]
      interval: 5s
      timeout: 5s
      retries: 20

  java-backend:
    build:
      context: ./java-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Inside the container the server must listen on every interface, otherwise
      # the published port below cannot reach it. The host mapping keeps it local.
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/agent}
      POSTGRES_DB: ${POSTGRES_DB:-agent}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-PLACEHOLDER_DB_PASSWORD}
      PII_ENC_KEY: ${PII_ENC_KEY:-PLACEHOLDER_PII_ENC_KEY}
      # Container-to-container for the health check; the browser gets the
      # published address instead, because it is outside this network.
      VOICE_INTERNAL_URL: http://python-voice:8090
      VOICE_PUBLIC_WS_URL: ws://localhost:${PY_PORT:-8090}
    volumes:
      # The one-shot legacy importer reads the v1 JSON tree from here.
      - ./java-backend/data:/app/data:ro
      - ./secrets:/app/secrets:ro
    ports:
      - "127.0.0.1:${JAVA_PORT:-8080}:8080"

  python-voice:
    build:
      context: ./python-voice
    environment:
      JAVA_BASE_URL: http://java-backend:8080
      # Google speech is used only if a real key file is mounted below.
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/gcp-credentials.json
    volumes:
      - ./secrets:/app/secrets:ro
    ports:
      - "127.0.0.1:${PY_PORT:-8090}:8090"

volumes:
  pgdata:
